<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 495" font-family="Arial, Helvetica, sans-serif">
  <title>Arquitectura del proyecto Sistema Inmune</title>
  <defs>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="flecha-grafito" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3f45"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="495" fill="#ffffff"/>

  <!-- Capas -->
  <rect x="5" y="10" width="580" height="80" fill="#f8f8f8"/>
  <rect x="5" y="90" width="580" height="75" fill="#efefef"/>
  <rect x="5" y="165" width="580" height="75" fill="#f8f8f8"/>
  <rect x="5" y="240" width="580" height="75" fill="#efefef"/>
  <rect x="5" y="315" width="580" height="125" fill="#f8f8f8"/>
  <g font-size="10.5" font-weight="bold" fill="#4a4a4a">
    <text x="12" y="54">INTERNET</text>
    <text x="12" y="132">EDGE</text>
    <text x="12" y="207">CORE</text>
    <text x="12" y="282">DISTRIBUCIÓN</text>
    <text x="12" y="382">ACCESO</text>
  </g>

  <!-- Enlaces de la red del TP3 -->
  <g stroke="#9a9a9a" stroke-width="2" fill="none">
    <line x1="300" y1="72" x2="380" y2="106"/>
    <line x1="500" y1="72" x2="420" y2="106"/>
    <line x1="380" y1="150" x2="300" y2="181"/>
    <line x1="420" y1="150" x2="500" y2="181"/>
    <line x1="360" y1="203" x2="440" y2="203"/>
    <line x1="300" y1="225" x2="300" y2="256"/>
    <line x1="335" y1="225" x2="465" y2="256"/>
    <line x1="465" y1="225" x2="335" y2="256"/>
    <line x1="500" y1="225" x2="500" y2="256"/>
    <line x1="300" y1="300" x2="300" y2="330"/>
    <line x1="335" y1="300" x2="465" y2="330"/>
    <line x1="465" y1="300" x2="335" y2="330"/>
    <line x1="500" y1="300" x2="500" y2="330"/>
    <line x1="300" y1="374" x2="300" y2="392"/>
    <line x1="500" y1="374" x2="500" y2="392"/>
  </g>

  <!-- Nodos de la red del TP3 -->
  <g stroke="#4a4a4a" stroke-width="1.5" fill="#f6f6f6">
    <rect x="240" y="28" width="120" height="44" rx="7"/>
    <rect x="440" y="28" width="120" height="44" rx="7"/>
    <rect x="340" y="106" width="120" height="44" rx="7"/>
    <rect x="240" y="181" width="120" height="44" rx="7"/>
    <rect x="440" y="181" width="120" height="44" rx="7"/>
    <rect x="240" y="256" width="120" height="44" rx="7"/>
    <rect x="440" y="256" width="120" height="44" rx="7"/>
    <rect x="240" y="330" width="120" height="44" rx="7"/>
    <rect x="440" y="330" width="120" height="44" rx="7"/>
    <rect x="250" y="392" width="100" height="40" rx="6"/>
    <rect x="450" y="392" width="100" height="40" rx="6"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1f">
    <g font-size="14" font-weight="bold">
      <text x="300" y="48">ISP-1</text>
      <text x="500" y="48">ISP-2</text>
      <text x="400" y="126">EDGE</text>
      <text x="300" y="201">CORE-1</text>
      <text x="500" y="201">CORE-2</text>
      <text x="300" y="276">DIST-1</text>
      <text x="500" y="276">DIST-2</text>
      <text x="300" y="350">SW-USERS</text>
      <text x="500" y="350">SW-SERVERS</text>
      <text x="300" y="409">PC-USER</text>
      <text x="500" y="409">SRV</text>
    </g>
    <g font-size="11" fill="#4a4a4a">
      <text x="300" y="63">AS 65001</text>
      <text x="500" y="63">AS 65002</text>
      <text x="400" y="141">AS 65000 · firewall</text>
      <text x="300" y="216">OSPF</text>
      <text x="500" y="216">OSPF</text>
      <text x="300" y="291">VRRP 10 master</text>
      <text x="500" y="291">VRRP 20 master</text>
      <text x="300" y="365">10.10.0.0/24</text>
      <text x="500" y="365">10.20.0.0/24</text>
      <text x="300" y="424">.100</text>
      <text x="500" y="424">.100</text>
    </g>
  </g>

  <!-- Intruso y defensa -->
  <line x1="205" y1="50" x2="240" y2="50" stroke="#c0392b" stroke-width="2"/>
  <rect x="95" y="28" width="110" height="44" rx="7" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="150" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#8e2a20">INTRUSO</text>
  <text x="150" y="63" text-anchor="middle" font-size="11" fill="#8e2a20">203.0.113.10</text>
  <path d="M150,72 C150,118 240,128 337,128" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#flecha-roja)"/>
  <rect x="95" y="134" width="210" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#8e2a20">Escaneo de puertos: el EDGE</text>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#8e2a20">lo detecta (psd) y lo bloquea (raw)</text>

  <!-- Estación: VM Ubuntu -->
  <line x1="560" y1="352" x2="600" y2="352" stroke="#3a3f45" stroke-width="2"/>
  <text x="580" y="345" text-anchor="middle" font-size="10" fill="#3a3f45">túnel</text>
  <rect x="600" y="276" width="192" height="164" rx="7" fill="#f0f0f0" stroke="#3a3f45" stroke-width="1.5"/>
  <text x="696" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2f33">Estación (VM Ubuntu)</text>
  <text x="696" y="308" text-anchor="middle" font-size="11" fill="#2b2f33">10.20.0.101 · VirtualBox</text>
  <rect x="610" y="316" width="172" height="48" rx="5" fill="#ffffff" stroke="#3a3f45" stroke-width="1"/>
  <text x="696" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b2f33">Docker Compose</text>
  <text x="696" y="346" text-anchor="middle" font-size="10.5" fill="#2b2f33">Prometheus · Grafana</text>
  <text x="696" y="358" text-anchor="middle" font-size="10.5" fill="#2b2f33">mktxp · blackbox</text>
  <rect x="610" y="370" width="172" height="28" rx="5" fill="#ffffff" stroke="#3a3f45" stroke-width="1"/>
  <text x="696" y="388" text-anchor="middle" font-size="11" fill="#2b2f33"><tspan font-weight="bold">Ansible</tspan> · defensa.yml</text>
  <rect x="610" y="404" width="172" height="28" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="696" y="422" text-anchor="middle" font-size="11" fill="#8e2a20"><tspan font-weight="bold">INTRUSO</tspan> (container, 2.º túnel)</text>
  <path d="M696,276 L696,128 L463,128" fill="none" stroke="#3a3f45" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#flecha-grafito)"/>
  <g font-size="11" fill="#2b2f33" text-anchor="end">
    <text x="688" y="186">métricas (API-SSL,</text>
    <text x="688" y="200">solo lectura)</text>
    <text x="688" y="214">y Ansible (SSH)</text>
  </g>

  <!-- Leyenda -->
  <g font-size="11" fill="#1f1f1f">
    <line x1="10" y1="470" x2="42" y2="470" stroke="#9a9a9a" stroke-width="2"/>
    <text x="48" y="474">Red del TP3, sin cambios de diseño</text>
    <line x1="270" y1="470" x2="302" y2="470" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="308" y="474">Ataque y defensa</text>
    <line x1="440" y1="470" x2="472" y2="470" stroke="#3a3f45" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="478" y="474">Monitoreo y automatización</text>
  </g>
</svg>
